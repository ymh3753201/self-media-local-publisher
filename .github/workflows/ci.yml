name: Local validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: python -m pip install .
      - name: Run local and integration tests
        run: python -B -m unittest discover -s tests -v
      - name: Check public files
        run: python scripts/check_public_files.py
      - name: Smoke test installed CLI away from source
        run: |
          mkdir -p .publisher-runs/installed-smoke
          cd .publisher-runs/installed-smoke
          publisherctl doctor --json
          publisherctl context --json
