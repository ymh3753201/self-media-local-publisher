name: Local validation
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: python -m pip install .
      - name: Run local and integration tests
        run: python -B -m unittest discover -s tests -v
      - name: Check public files
        run: python scripts/check_public_files.py
      - name: Smoke test installed CLI away from source
        run: |
          mkdir -p .publisher-runs/installed-smoke
          cd .publisher-runs/installed-smoke
          publisherctl doctor --json
          publisherctl context --json
