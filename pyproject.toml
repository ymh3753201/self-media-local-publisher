[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "self-media-local-publisher"
version = "0.1.0"
description = "Local multi-platform video planning and human-review assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Self Media Local Publisher contributors"}]
dependencies = []

[project.scripts]
publisherctl = "self_media_publisher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
self_media_publisher = ["data/*.json"]
